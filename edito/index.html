<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에디토 · 카드뉴스 메이커</title>
<meta name="description" content="원고를 붙여넣으면 인스타그램 카드뉴스가 완성되는 개인용 매거진 메이커">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="에디토">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/app.css?v=20261127e">
<script>
  /* 개발용 오류 수집기 (화면에는 아무것도 그리지 않습니다) */
  window.__editoErrors = [];
  window.addEventListener('error', function (e) { window.__editoErrors.push(String(e.message) + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__editoErrors.push('rejection: ' + String(e.reason)); });
</script>
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">E</span>
      <span class="brand-name">에디토<em>EDITO</em></span>
    </div>
    <div class="top-actions">
      <button class="chip-btn" id="btnRatio" type="button" aria-label="비율 바꾸기">4:5</button>
      <button class="icon-btn" id="btnHelp" type="button" aria-label="사용법">?</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="track" id="track"></div>
    <div class="empty" id="empty">
      <div class="empty-card">
        <div class="empty-eyebrow">CARD NEWS MAKER</div>
        <h1>원고만 붙여넣으면<br>카드뉴스가 됩니다</h1>
        <p>매거진처럼 정리된 카드 덱을 만들고,<br>1080px PNG로 바로 저장하세요.</p>
        <button class="primary-btn" id="btnStart" type="button">원고 붙여넣기</button>
        <button class="ghost-btn" id="btnDemo" type="button">예시 원고로 둘러보기</button>
        <ul class="empty-tips">
          <li>빈 줄은 문단 · # 소제목 · --- 장 나누기</li>
          <li>워터마크 없음 · 회원가입 없음 · 자동 저장</li>
        </ul>
      </div>
    </div>
    <div class="cover-guide" id="coverGuide" hidden>
      <div class="cover-guide-band top"></div>
      <div class="cover-guide-label">인스타 그리드 1:1 잘림 영역</div>
      <div class="cover-guide-band bottom"></div>
    </div>
    <div class="drag-hint" id="dragHint" hidden>사진을 끌어서 위치를 옮겨보세요</div>
  </main>

  <div class="meter" id="meter">
    <div class="meter-count"><b id="cardNo">1</b><span>/ <i id="cardTotal">1</i></span></div>
    <div class="dots" id="dots"></div>
    <div class="meter-label" id="cardLabel">표지</div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-sheet="source" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      <span>원고</span>
    </button>
    <button class="tab" data-sheet="design" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg>
      <span>디자인</span>
    </button>
    <button class="tab" data-sheet="card" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>카드</span>
    </button>
    <button class="tab" data-sheet="check" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span>점검</span>
    </button>
    <button class="tab" data-sheet="save" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>저장</span>
    </button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber" id="grabber"><span></span></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">원고</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="닫기">✕</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <div class="modal-top">
      <span id="modalTitle">카드 미리보기</span>
      <button class="icon-btn" id="modalClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="modal-img" id="modalImg"></div>
    <p class="modal-hint">이미지를 꾹 눌러 <b>사진에 저장</b>할 수 있어요</p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">만드는 중…</span></div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>

<script src="js/core.js?v=20261127e"></script>
<script src="js/render.js?v=20261127e"></script>
<script src="js/app.js?v=20261127e"></script>
</body>
</html>
