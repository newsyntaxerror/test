<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에디토 모바일 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b1f;display:grid;place-items:center;font-family:-apple-system,sans-serif}
  .phone{width:390px;height:844px;border-radius:46px;background:#000;padding:9px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #333}
  iframe{width:390px;height:844px;border:0;border-radius:38px;background:#0a0a0c;display:block}
  .label{position:fixed;top:8px;left:12px;color:#666;font-size:11px}
</style>
</head>
<body>
<div class="label">390 × 844 mobile preview</div>
<div class="phone"><iframe src="./" title="에디토"></iframe></div>
</body>
</html>
