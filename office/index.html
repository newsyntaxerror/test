<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달콩 비서실</title>
<meta name="description" content="달콩 님의 개인 AI 멀티 비서실 — 회의실 · 작업실 · 비서현황 · 메모">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191410" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="비서실">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>

<!-- PIN 잠금 (설정에서 PIN을 켰을 때만) -->
<div class="pin-gate" id="pinGate" hidden>
  <div class="pin-card">
    <div class="pin-mark">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
    </div>
    <h2>달콩 비서실</h2>
    <p>PIN 4자리를 입력해 주세요</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <p class="pin-error" id="pinError" hidden>PIN이 맞지 않습니다.</p>
    <div class="pin-pad" id="pinPad">
      <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
      <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
      <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
      <button data-pin="clear" class="pin-sub">지우기</button><button data-pin="0">0</button><button data-pin="del" class="pin-sub">⌫</button>
    </div>
    <p class="pin-note">PIN은 이 기기에만 저장되는 화면 잠금입니다.</p>
  </div>
</div>

<div class="app">
  <div class="chrome">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V8.5L12 4l8 4.5V20"/>
          <path d="M4 20h16"/>
          <path d="M9 20v-5.5h6V20"/>
          <path d="M9.5 10.5h.01M14.5 10.5h.01"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>달콩 비서실</h1>
        <p id="brandSub">개인 AI 비서실</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="conn-badge" id="connBadge" data-act="settings" data-settings-tab="sync" title="동기화 상태">
        <span class="dot"></span><span id="connLabel">연결 확인 중</span>
      </button>
      <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="테마 바꾸기" title="테마 바꾸기">
        <svg class="ico-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="주요 화면">
    <button class="tab is-active" data-act="tab" data-tab="room" aria-selected="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-5.4A7.5 7.5 0 0 1 12.5 4.5 7.5 7.5 0 0 1 20 12z"/></svg>
      <span>회의실</span>
    </button>
    <button class="tab" data-act="tab" data-tab="tasks" aria-selected="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>
      <span>작업실</span>
      <em class="tab-badge" id="taskBadge" hidden>0</em>
    </button>
    <button class="tab" data-act="tab" data-tab="team" aria-selected="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/><path d="M16 5.4a3.2 3.2 0 0 1 0 6.2"/><path d="M17.4 14.9c2.1.6 3.6 2.4 3.6 5.1"/></svg>
      <span>비서현황</span>
    </button>
    <button class="tab" data-act="tab" data-tab="memos" aria-selected="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9.5L20 8v12.5H6z"/><path d="M15 3.5V8h4.5"/><path d="M9 12h7M9 16h5"/></svg>
      <span>메모</span>
    </button>
  </nav>
  </div>

  <main id="main" class="main"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./config.js?v=4"></script>
<script src="./vendor/supabase.js?v=4"></script>
<script src="./store.js?v=4"></script>
<script src="./ai.js?v=4"></script>
<script src="./app.js?v=4"></script>
</body>
</html>
